[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iamdataeng-s3-lambda-ingestion"
version = "0.1.0"
description = "IAmDataEng junior project — S3 -> Lambda -> DynamoDB on LocalStack, Terraform-provisioned"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3==1.34.131",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools]
packages = ["src", "fixtures", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
